name: Sonda do IF.data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/ifdata/**"
      - ".github/workflows/sonda-ifdata.yml"

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sondar a API
        run: python scripts/ifdata/sonda_datas.py
      - name: Gravar o resultado
        run: |
          git config user.name "Eliéser Ribeiro"
          git config user.email "66757713+elieserribeiro@users.noreply.github.com"
          git add docs/discovery
          if git diff --cached --quiet; then echo "Sem mudanças."; else
            git commit -m "Atualiza sonda do IF.data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
