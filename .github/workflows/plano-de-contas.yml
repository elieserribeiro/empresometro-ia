name: Diagnóstico do plano de contas

# Carrega as DFP do último exercício completo em um banco temporário e
# lista as contas fixas de cada tipo de plano, para definir os indicadores.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/diagnostico/**"
      - ".github/workflows/plano-de-contas.yml"

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: empresometro
          POSTGRES_PASSWORD: empresometro
          POSTGRES_DB: empresometro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U empresometro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://empresometro:empresometro@localhost:5432/empresometro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o projeto e criar as tabelas
        run: |
          python -m pip install --quiet -e .
          alembic upgrade head
      - name: Carregar as DFP do último exercício completo
        run: python -m empresometro.etl carregar --tipos dfp --anos $(( $(date +%Y) - 1 )) --sem-macro --sem-qualidade --sem-indicadores
      - name: Gerar o diagnóstico
        run: python scripts/diagnostico/plano_de_contas.py --saida docs/indicadores/plano_de_contas.md
      - name: Gravar o diagnóstico no repositório
        run: |
          git config user.name "Eliéser Ribeiro"
          git config user.email "66757713+elieserribeiro@users.noreply.github.com"
          git add docs/indicadores
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza diagnóstico do plano de contas"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
