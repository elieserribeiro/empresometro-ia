name: Diagnóstico dos documentos

# Mede o volume e o conteúdo das fontes documentais da CVM (FRE e IPE).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/documentos/**"
      - ".github/workflows/diagnostico-documentos.yml"

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Medir o volume das companhias do piloto
        run: python scripts/documentos/volume_piloto.py
      - name: Gravar o diagnóstico no repositório
        run: |
          git config user.name "Eliéser Ribeiro"
          git config user.email "66757713+elieserribeiro@users.noreply.github.com"
          git add docs/discovery docs/documentos
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza diagnóstico dos documentos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
