name: Carga de teste

# Valida o ETL com dados reais da CVM em um banco temporário:
# cadastro, DFP do último exercício completo e ITR do ano corrente.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/empresometro/etl/**"
      - "migrations/**"
      - ".github/workflows/carga-teste.yml"

permissions:
  contents: write

concurrency:
  group: carga-teste
  cancel-in-progress: false

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: empresometro
          POSTGRES_PASSWORD: empresometro
          POSTGRES_DB: empresometro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U empresometro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://empresometro:empresometro@localhost:5432/empresometro
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o projeto
        run: python -m pip install --quiet -e .

      - name: Aplicar as migrações
        run: alembic upgrade head

      - name: Carregar DFP do último exercício completo
        run: python -m empresometro.etl carregar --tipos dfp --anos $(( $(date +%Y) - 1 )) --sem-macro --sem-qualidade --sem-indicadores --sem-ifdata

      - name: Carregar ITR do ano corrente e gerar o relatório
        run: >
          python -m empresometro.etl carregar --tipos itr --anos $(date +%Y)
          --usar-local --sem-indicadores --sem-ifdata --saida docs/etl/teste/relatorio_carga_teste.md
          && mv docs/etl/teste/relatorio_carga_teste.md docs/etl/relatorio_carga_teste.md

      - name: Conferir a recarga incremental
        run: python -m empresometro.etl carregar --tipos itr --anos $(date +%Y) --usar-local --sem-macro --sem-qualidade --sem-indicadores --sem-ifdata

      - name: Mostrar o relatório no resumo da execução
        if: always()
        run: |
          if [ -f docs/etl/relatorio_carga_teste.md ]; then
            cat docs/etl/relatorio_carga_teste.md >> "$GITHUB_STEP_SUMMARY"
            cat docs/etl/teste/*.md >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Gravar o relatório no repositório
        run: |
          git config user.name "Eliéser Ribeiro"
          git config user.email "66757713+elieserribeiro@users.noreply.github.com"
          git add docs/etl
          if git diff --cached --quiet; then
            echo "Sem mudanças no relatório."
          else
            git commit -m "Atualiza relatório da carga de teste"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
