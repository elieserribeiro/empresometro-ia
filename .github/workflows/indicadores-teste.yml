name: Indicadores de teste

# Valida o cálculo dos indicadores com dados reais em um banco temporário:
# dois exercícios de DFP e dois anos de ITR, o mínimo para os 12 meses móveis.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/empresometro/indicadores/**"
      - "migrations/**"
      - ".github/workflows/indicadores-teste.yml"

permissions:
  contents: write

concurrency:
  group: indicadores-teste
  cancel-in-progress: false

jobs:
  indicadores:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: empresometro
          POSTGRES_PASSWORD: empresometro
          POSTGRES_DB: empresometro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U empresometro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://empresometro:empresometro@localhost:5432/empresometro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o projeto e criar as tabelas
        run: |
          python -m pip install --quiet -e .
          alembic upgrade head
      - name: Carregar dois exercícios de DFP e dois anos de ITR
        run: |
          ANO=$(date +%Y)
          python -m empresometro.etl carregar --anos $((ANO - 2)) $((ANO - 1)) $ANO --sem-macro --sem-qualidade --sem-indicadores
      - name: Calcular os indicadores
        run: python -m empresometro.etl indicadores --saida docs/indicadores/teste/relatorio_indicadores.md
      - name: Mostrar o relatório no resumo da execução
        if: always()
        run: cat docs/indicadores/teste/relatorio_indicadores.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Gravar o relatório no repositório
        run: |
          git config user.name "Eliéser Ribeiro"
          git config user.email "66757713+elieserribeiro@users.noreply.github.com"
          git add docs/indicadores
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza relatório dos indicadores de teste"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
