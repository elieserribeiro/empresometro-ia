# Infraestrutura local do Empresômetro IA.
#
# 1. Copie .env.example para .env e troque a senha.
# 2. Carga completa dos dados (sobe o banco, cria as tabelas e carrega):
#        docker compose run --rm etl
# 3. Só o banco:
#        docker compose up -d db
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: empresometro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-empresometro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-empresometro}
    ports:
      # Acessível somente a partir deste computador.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-empresometro} -d ${POSTGRES_DB:-empresometro}"]
      interval: 5s
      timeout: 5s
      retries: 20

  etl:
    build: .
    profiles: ["etl"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-empresometro}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:-empresometro}
    volumes:
      # Arquivos baixados da CVM e relatórios ficam visíveis na pasta do projeto.
      - ./data:/app/data
      - ./docs:/app/docs

  documentos:
    # Coleta de documentos das companhias do piloto: docker compose run --rm documentos
    build: .
    profiles: ["documentos"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-empresometro}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:-empresometro}
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
    entrypoint: ["sh", "-c", "alembic upgrade head && exec python -m empresometro.documentos \"$$@\"", "--"]
    command: ["coletar"]

volumes:
  dados_postgres:
